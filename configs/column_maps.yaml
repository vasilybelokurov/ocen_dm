# Explicit role -> source-column maps, keyed by schema name.
#
#   ra: RA_ICRS                       # source column only (it carries its unit)
#   r:  {column: R, unit: arcmin}     # source column plus its INPUT unit
#
# The second form is required when the source column carries no unit. Values are
# then CONVERTED to the schema unit; loading fails rather than assuming a unit.
# Misspelled role names are rejected, and two roles may not share one column.

# Kuzma & Ishigaki 2025 (Zenodo 14791430, wCen_table.fits, 157481 rows).
# The FITS carries NO units, so each input unit is declared here. Justification,
# checked against the file on 2026-09-16: RA 194-209 and Dec -52 to -42 are
# degrees around omega Cen (201.7, -47.5); proper motions span +-60 with errors
# 0.01-0.1, the Gaia mas/yr convention; G_0 6.5-16 are magnitudes; FeH_CaHKsyn
# -4 to 0 is dex; P_mem lies in [0,1].
kuzma2025_periphery:
  source_id: source_id
  ra:  {column: RA,  unit: deg}
  dec: {column: Dec, unit: deg}
  pmra:        {column: pmRA,   unit: mas / yr}
  pmdec:       {column: pmDE,   unit: mas / yr}
  pmra_error:  {column: e_pmRA, unit: mas / yr}
  pmdec_error: {column: e_pmDE, unit: mas / yr}
  g0_mag:    {column: G_0,    unit: mag}
  bp0_mag:   {column: BP_0,   unit: mag}
  rp0_mag:   {column: RP_0,   unit: mag}
  cahk0_mag: {column: CaHK_0, unit: mag}
  feh:    FeH_CaHKsyn
  feh_lo: FeH_CaHKsyn_16th
  feh_hi: FeH_CaHKsyn_84th
  membership_prob: P_mem
  # pmX/pmY (tail-aligned frame) are carried through as src_pmX, src_pmY.
# Kuzma et al. 2026, extended Table 3 (592 rows, 157 members). Units are taken
# from the file's own header block, which documents: RA/Dec in degrees, G in mag,
# V_h and its error in km/s, [Fe/H] and its error in dex.
kuzma2026_spectroscopy:
  star_id:   Star_ID
  source_id: DR3_Source_ID
  ra:  {column: ra,  unit: deg}
  dec: {column: dec, unit: deg}
  g_mag:      {column: G,       unit: mag}
  vlos:       {column: V_h,     unit: km / s}
  vlos_error: {column: V_h_err, unit: km / s}
  feh:        FeH
  feh_error:  FeH_err
  membership_prob: P_mem
  member_flag:     Member

# Fimbulthul resolves automatically against the real VizieR column names
# (J/other/NatAs/3.667/tables1, inspected 2026-09-16).
fimbulthul_members: {}

# oMEGACat VI: column names below were read from the downloaded FITS files on
# 2026-09-16, not guessed. All carry units in the file, so no unit is declared
# here. Errors are asymmetric: e_lower_* / e_upper_*.

omegacat_vi_pm_radial:
  r_lower: r_lower
  r_median: r_median
  r_upper: r_upper
  n_stars: nstars
  sigma_pmr: sigma_pm_rad
  sigma_pmr_err_lo: e_lower_sigma_pm_rad
  sigma_pmr_err_hi: e_upper_sigma_pm_rad

omegacat_vi_pm_tangential:
  r_lower: r_lower
  r_median: r_median
  r_upper: r_upper
  n_stars: nstars
  sigma_pmt: sigma_pm_tan
  sigma_pmt_err_lo: e_lower_sigma_pm_tan
  sigma_pmt_err_hi: e_upper_sigma_pm_tan

omegacat_vi_pm_combined:
  r_lower: r_lower
  r_median: r_median
  r_upper: r_upper
  n_stars: nstars
  sigma_pmc: sigma_pm_c
  sigma_pmc_err_lo: e_lower_sigma_pm_c
  sigma_pmc_err_hi: e_upper_sigma_pm_c

omegacat_vi_los_dispersion:
  r_lower: r_lower
  r_median: r_median
  r_upper: r_upper
  n_stars: nstars
  sigma_los: sigma_los
  sigma_los_err_lo: e_lower_sigma_los
  sigma_los_err_hi: e_upper_sigma_los

# 'vlos' in los_profile.fits is the ROTATION AMPLITUDE per bin (0.76-10.34 km/s),
# not the ~232 km/s systemic velocity; checked against the file on 2026-09-16.
# theta_0 is the position angle of the rotation axis (paper Table 3).
omegacat_vi_los_rotation:
  r_lower: r_lower
  r_median: r_median
  r_upper: r_upper
  n_stars: nstars
  v_rot: vlos
  v_rot_err_lo: e_lower_vlos
  v_rot_err_hi: e_upper_vlos
  theta_0: theta_0
  theta_0_err_lo: e_lower_theta_0
  theta_0_err_hi: e_upper_theta_0

# Vasiliev & Baumgardt 2021 members: units from the zip's !readme.txt (the FITS
# compilation carries none). Checked 2026-09-16.
vasiliev2021_ocen_members:
  source_id: SOURCE_ID
  ra:  {column: RA,  unit: deg}
  dec: {column: DEC, unit: deg}
  x:   {column: X,   unit: deg}
  y:   {column: Y,   unit: deg}
  parallax:       {column: PLX,    unit: mas}
  pmra:           {column: PMRA,   unit: mas / yr}
  pmdec:          {column: PMDEC,  unit: mas / yr}
  parallax_error: {column: PLXE,   unit: mas}
  pmra_error:     {column: PMRAE,  unit: mas / yr}
  pmdec_error:    {column: PMDECE, unit: mas / yr}
  pmra_pmdec_corr: PMCORR
  g_mag:  {column: G_MAG, unit: mag}
  bp_rp:  {column: BP_RP, unit: mag}
  source_density: {column: SIGMA, unit: 1 / arcmin2}
  quality_flag: GFLAG
  membership_prob: PROB

# Baumgardt database compilation: units are the database's conventions (kpc, mas/yr,
# km/s, Msun, pc) -- the file records none. UNVERIFIED against upstream.
baumgardt_ocen_parameters:
  name: NAME
  ra:  {column: RA,  unit: deg}
  dec: {column: DEC, unit: deg}
  pmra:  {column: PMRA,  unit: mas / yr}
  pmdec: {column: PMDEC, unit: mas / yr}
  pmra_error:  {column: PMRA_ERR,  unit: mas / yr}
  pmdec_error: {column: PMDEC_ERR, unit: mas / yr}
  distance:       {column: DIST,     unit: kpc}
  distance_error: {column: DIST_ERR, unit: kpc}
  rv:       {column: RV,     unit: km / s}
  rv_error: {column: RV_ERR, unit: km / s}
  mass: {column: MASS, unit: Msun}
  r_h:  {column: RH,   unit: pc}
  r_c:  {column: RC,   unit: pc}
  r_peri: {column: RPERI, unit: kpc}
  r_apo:  {column: RAPO,  unit: kpc}
  feh: FEH

# VizieR VOTables carry their units; no declarations needed.
trager1995_ocen_sbp: {}
baumgardt2019_ocen_pm_dispersion: {}
