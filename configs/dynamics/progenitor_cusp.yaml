# Controlled progenitor pilot, not a cosmological M200 parameterization.
# DM beta=-0.3 matches the physically admissible cored comparison.
programme: progenitor
seed: 42
nucleus: {mass_msun: 3550000.0, scale_pc: 5.4}
components:
  - name: dm
    gamma: 1.0
    outer_slope: 3.0
    scale_pc: 1000.0
    cutoff_pc: 10000.0
    mass_msun: 1000000000.0
    beta: -0.3
    n_particles: 200000
    softening_pc: 2.0
    refinement_radius_pc: 100.0
    refinement_floor: 0.001
  - name: stars
    gamma: 1.0
    outer_slope: 4.0
    scale_pc: 500.0
    cutoff_pc: 3000.0
    mass_msun: 100000000.0
    beta: 0.0
    n_particles: 100000
    softening_pc: 1.0
    refinement_radius_pc: 100.0
    refinement_floor: 0.001
orbit: {kind: isolation, duration_myr: 100.0, sample_step_myr: 0.05}
integrator: {max_step_myr: 0.02, levels: 4, output_step_myr: 2.0, theta: 0.5, accuracy: 0.00000001}
