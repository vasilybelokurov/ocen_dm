# Which local file holds which analysis product.
#
# Filled in on 2026-09-16 from the REAL downloaded files, inspected with
# `ocen inspect-omegacat --columns`. Zenodo record 10.5281/zenodo.14978551.
#
# The three PM profiles come from ONE file and therefore share bins and stars:
# they are not independent likelihood factors. The same holds for the two LOS
# profiles. Recorded here because the kinematic likelihood must respect it.

omegacat_vi:
  products:
    pm_radial:      {file: proper_motion_dispersion_log_bins.fits, hdu: 1}
    pm_tangential:  {file: proper_motion_dispersion_log_bins.fits, hdu: 1}
    pm_combined:    {file: proper_motion_dispersion_log_bins.fits, hdu: 1}
    los_dispersion: {file: los_profile.fits, hdu: 1}
    los_rotation:   {file: los_profile.fits, hdu: 1}

  # Alternative binnings of the SAME stars, available but not used in v1:
  #   proper_motion_dispersion_lin_bins.fits
  #   proper_motion_dispersion_equaln_bins.fits
  #   proper_motion_dispersion_voronoi_bins.fits
  #   los_dispersion_and_rotation_voronoi_bins.fits
  # Fitting more than one binning of the same data would double-count it.

kuzma2025_pristine:
  file: wCen_table.fits
  hdu: 1

kuzma2026_spectroscopy:
  file_glob: kuzma2026_members.*
  # Delivered 2026-09-16 as whitespace-separated ASCII whose column-name line is
  # the LAST comment line, so the header position must be stated explicitly.
  format: ascii.commented_header
  reader_kwargs:
    header_start: -1

fimbulthul_ibata2019:
  file_glob: fimbulthul_supp_table1.*

streamfinder_ibata2021_edr3:
  # Ibata+2021, ApJ 914, 123 (arXiv:2012.05245), VizieR J/ApJ/914/123/table1: STREAMFINDER
  # DR2 detections with EDR3 astrometry, 5960 stars, HRV where measured. Fetched 2026-10-08
  # (approved) into the canonical store, not copied here. sha256 of the FITS written from the
  # VizieR VOTable: d5cdffa67a79f4170d3d8866bf72a888617c3a0de22ddf18029202293a90859b.
  # omega Cen / Fimbulthul = Stream 16: 1006 stars, 33 with HRV; contains all 309 I19 members
  # (positional match < 1 arcsec). The Ibata+2024 DR3 atlas (arXiv:2311.17202) member list
  # was not found on VizieR or the ApJ page on 2026-10-08.
  path: ~/data/catalogues/streamfinder_ibata2021_edr3.fits
  fimbulthul_stream_id: 16
